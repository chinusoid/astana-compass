[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "astana-city-data"
version = "0.1.0"
description = "Bounded OSM snapshot ingestion and evidence-backed Astana PlaceRepository"
requires-python = ">=3.12,<3.15"
dependencies = ["astana-contracts>=0.1.0,<0.2", "httpx>=0.28,<1"]

[project.scripts]
astana-import-osm = "astana_city_data.importer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astana_city_data"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md"]
