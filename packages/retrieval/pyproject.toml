[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "astana-retrieval"
version = "0.1.0"
description = "Bounded multilingual lexical candidate retrieval for Astana Compass"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["astana-contracts>=0.1.0,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/astana_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
